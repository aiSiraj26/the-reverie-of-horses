name: Tests

on:
  push:
  pull_request:

# Opt JavaScript actions into Node.js 24 ahead of GitHub's forced cutover
# (2026-06-02). Lets any breakage surface here instead of on the deadline.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Default to the least privilege for every job. Individual jobs opt into
# more (e.g. `pages: write` for deploy).
permissions:
  contents: read

# Ensure only one Pages deploy runs at a time; let in-flight deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Inherits the default `contents: read` from above; no other scopes needed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (with system deps)
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: playwright
    # Only deploy when the green commit lands on main.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Pages deploy needs these; scope them to this job only.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Stage static site
        run: |
          # Stage by convention, not by enumerating files: copy the whole repo
          # to a scratch dir OUTSIDE the tree, strip what must not ship, then
          # move it into _site. Adding a new page/asset needs no edit here —
          # which prevents the silent-404 class of bug where the manifest and
          # the file tree drift apart. Uses only cp/rm (no rsync dependency)
          # so the step is portable and locally reproducible.
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -R . "$tmp/site"
          rm -rf "$tmp/site/.git" "$tmp/site/.github" "$tmp/site/node_modules" \
                 "$tmp/site/tests" "$tmp/site/_site" \
                 "$tmp/site/playwright-report" "$tmp/site/test-results"
          rm -f "$tmp/site/package.json" "$tmp/site/package-lock.json" \
                "$tmp/site/playwright.config.ts" "$tmp"/site/*.md
          rm -rf _site
          mv "$tmp/site" _site
          rm -rf "$tmp"

      - name: Verify staged site
        run: |
          # Post-condition guard: fail loudly if staging produced something
          # broken, instead of deploying a site that 404s. Assert the entry
          # point and shared stylesheet exist, then check every local asset
          # referenced by each HTML page is actually present in _site.
          #
          # Note: a `while read` after a pipe runs in a SUBSHELL, so an `exit`
          # or variable set inside it does NOT affect this script. We avoid
          # that trap entirely with a process-substitution feed and a flag.
          set -euo pipefail
          test -f _site/index.html || { echo "::error::_site/index.html missing"; exit 1; }
          test -f _site/styles.css || { echo "::error::_site/styles.css missing"; exit 1; }
          test -d _site/fonts      || { echo "::error::_site/fonts missing"; exit 1; }
          missing=0
          for html in _site/*.html; do
            while read -r ref; do
              [ -n "$ref" ] || continue
              if [ ! -f "_site/$ref" ]; then
                echo "::error file=$html::referenced asset missing from _site: $ref"
                missing=1
              fi
            done < <(grep -oE '(src|href)="[^"#:]+\.(css|js|jpg|jpeg|png|svg|webp|woff2?)"' "$html" \
                       | sed -E 's/.*="([^"]+)"/\1/' | sort -u)
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::staging is incomplete — see missing assets above"
            exit 1
          fi
          echo "Staged $(find _site -type f | wc -l) files; all referenced local assets present."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
